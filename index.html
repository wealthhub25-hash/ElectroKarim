<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إلكترو كريم — لوحة الموظفين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Changa:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12151a; --surface:#1a1f26; --surface2:#20262e; --line:#2a313b;
  --text:#eceef1; --muted:#8e97a3; --teal:#2dd9bd; --teal-dim:#1a4d45;
  --amber:#f3a93b; --amber-dim:#3a2f17; --danger:#e8615a;
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--bg); color:var(--text);
  font-family:'Tajawal',sans-serif; line-height:1.6;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100%;
}
h1,h2,h3,.display{font-family:'Changa',sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}

header{
  position:sticky; top:0; z-index:20;
  background:rgba(18,21,26,.92); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);
}
.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;max-width:880px;margin:0 auto;flex-wrap:wrap;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Changa';font-weight:700;font-size:19px}
.brand .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--teal),#1aa88f);display:flex;align-items:center;justify-content:center;color:#0b1210;font-weight:800;font-size:14px}
.brand small{display:block;color:var(--muted);font-weight:400;font-size:11px;font-family:'Tajawal'}
.tabs{display:flex;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px}
.tab{padding:9px 18px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;border:none;background:none;color:var(--muted);font-family:inherit}
.tab.active{background:var(--teal);color:#06130f}

main{padding:28px 0 60px}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.panel-head h2{font-size:22px}
.count-pill{background:var(--surface2);border:1px solid var(--line);color:var(--muted);font-size:12.5px;padding:4px 12px;border-radius:999px}

.layout{display:grid;grid-template-columns:300px 1fr;gap:18px}
@media(max-width:760px){.layout{grid-template-columns:1fr}}

.card-form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;align-self:start}
.card-form h3{font-size:15px;margin-bottom:2px}
.card-form input,.card-form select,.card-form textarea{
  background:var(--surface2);border:1px solid var(--line);border-radius:9px;
  padding:10px 12px;color:var(--text);font-family:inherit;font-size:14px;outline:none;width:100%;
}
.card-form input:focus,.card-form select:focus,.card-form textarea:focus{border-color:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:10px;font-weight:700;font-size:14.5px;border:none;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--teal);color:#06130f}
.msg{font-size:12px;color:var(--muted);min-height:14px}

.search-row input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--text);font-family:inherit;font-size:14px;margin-bottom:14px}

.ticket{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.ticket .main b{display:block;font-size:14.5px}
.ticket .main span{color:var(--muted);font-size:12px}
.ticket .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;border:none;white-space:nowrap;font-family:inherit}
.badge.pending{background:var(--amber-dim);color:var(--amber)}
.badge.ready{background:var(--teal-dim);color:var(--teal)}
.badge.delivered{background:#262c33;color:var(--muted)}
.price-tag{font-family:'Changa';font-weight:700;color:var(--amber);font-size:14.5px}
.del-btn{background:none;border:1px solid var(--line);color:var(--danger);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:11.5px;font-family:inherit}
.empty-state{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}

.supply-row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:9px;display:flex;align-items:center;gap:12px}
.supply-row.bought{opacity:.5}
.supply-row.bought .main b{text-decoration:line-through}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);background:var(--surface2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--teal)}
.supply-row.bought .chk{background:var(--teal-dim);border-color:var(--teal)}
.supply-row .main{flex:1}
.supply-row .main b{display:block;font-size:14.5px}
.supply-row .main span{color:var(--muted);font-size:12px}
.prio{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px}
.prio.high{background:#3a1c1c;color:var(--danger)}
.prio.normal{background:var(--surface2);color:var(--muted)}

footer{border-top:1px solid var(--line);padding:18px 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand"><span class="mark">EK</span><span>إلكترو كريم<small>لوحة الموظفين — خاص بالمحل</small></span></div>
    <div class="tabs">
      <button class="tab active" data-tab="repairs">الإصلاحات</button>
      <button class="tab" data-tab="supplies">المشتريات المطلوبة</button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">

    <section id="panel-repairs">
      <div class="panel-head">
        <h2 class="display">سجل الإصلاحات</h2>
        <span class="count-pill" id="repairsCount">0 تذكرة</span>
      </div>
      <div class="layout">
        <form class="card-form" id="repairForm">
          <h3>تذكرة جديدة</h3>
          <input type="text" id="r-customer" placeholder="اسم الزبون" required>
          <input type="text" id="r-model" placeholder="موديل الهاتف" required>
          <input type="text" id="r-issue" placeholder="وصف العطب" required>
          <input type="number" id="r-price" placeholder="الثمن (درهم)">
          <button type="submit" class="btn btn-primary">إضافة التذكرة</button>
          <span class="msg" id="repairMsg"></span>
        </form>
        <div>
          <div class="search-row"><input type="text" id="repairSearch" placeholder="قلب باسم الزبون ولا الموديل..."></div>
          <div id="ticketsList"><div class="empty-state">كيتحمل...</div></div>
        </div>
      </div>
    </section>

    <section id="panel-supplies" style="display:none">
      <div class="panel-head">
        <h2 class="display">المشتريات المطلوبة</h2>
        <span class="count-pill" id="suppliesCount">0 غرض</span>
      </div>
      <div class="layout">
        <form class="card-form" id="supplyForm">
          <h3>غرض جديد</h3>
          <input type="text" id="s-name" placeholder="اسم القطعة / الغرض" required>
          <input type="text" id="s-qty" placeholder="الكمية (مثال: 3 شاشات)">
          <select id="s-priority">
            <option value="normal">أولوية عادية</option>
            <option value="high">أولوية عالية</option>
          </select>
          <textarea id="s-note" placeholder="ملاحظة (اختياري)"></textarea>
          <button type="submit" class="btn btn-primary">إضافة للائحة</button>
          <span class="msg" id="supplyMsg"></span>
        </form>
        <div>
          <div class="search-row"><input type="text" id="supplySearch" placeholder="قلب فلائحة المشتريات..."></div>
          <div id="suppliesList"><div class="empty-state">كيتحمل...</div></div>
        </div>
      </div>
    </section>

  </div>
</main>

<footer>إلكترو كريم — صفحة داخلية خاصة بالموظفين</footer>

<script>
document.querySelectorAll('.tab').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
    btn.classList.add('active');
    var name = btn.dataset.tab;
    document.getElementById('panel-repairs').style.display = name==='repairs' ? '' : 'none';
    document.getElementById('panel-supplies').style.display = name==='supplies' ? '' : 'none';
  });
});

function escapeHtml(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

(async function(){
  var db=null;
  var repairsList=document.getElementById('ticketsList');
  var suppliesList=document.getElementById('suppliesList');
  var allRepairs=[], allSupplies=[];
  var statusLabel={pending:'قيد الإصلاح',ready:'جاهز للاستلام',delivered:'تم التسليم'};
  var statusCycle={pending:'ready',ready:'delivered',delivered:'pending'};

  function renderRepairs(){
    var q=(document.getElementById('repairSearch').value||'').trim().toLowerCase();
    var rows=allRepairs.filter(function(d){
      if(!q) return true;
      return ((d.customer||'')+' '+(d.model||'')).toLowerCase().indexOf(q)>-1;
    });
    document.getElementById('repairsCount').textContent = allRepairs.length+' تذكرة';
    if(!rows.length){ repairsList.innerHTML='<div class="empty-state">ما كاين حتى تذكرة</div>'; return; }
    repairsList.innerHTML = rows.map(function(d){
      return '<div class="ticket" data-id="'+d.id+'">'+
        '<div class="main"><b>'+escapeHtml(d.customer||'')+' — '+escapeHtml(d.model||'')+'</b>'+
        '<span>'+escapeHtml(d.issue||'')+'</span></div>'+
        '<div class="meta">'+
        '<span class="price-tag">'+(d.price!=null?d.price+' درهم':'—')+'</span>'+
        '<select class="badge '+d.status+'" data-action="status">'+
        '<option value="pending"'+(d.status==='pending'?' selected':'')+'>قيد الإصلاح</option>'+
        '<option value="ready"'+(d.status==='ready'?' selected':'')+'>جاهز للاستلام</option>'+
        '<option value="delivered"'+(d.status==='delivered'?' selected':'')+'>تم التسليم</option>'+
        '</select>'+
        '<button class="del-btn" data-action="del">حذف</button>'+
        '</div></div>';
    }).join('');
  }

  function renderSupplies(){
    var q=(document.getElementById('supplySearch').value||'').trim().toLowerCase();
    var rows=allSupplies.filter(function(d){
      if(!q) return true;
      return ((d.name||'')+' '+(d.note||'')).toLowerCase().indexOf(q)>-1;
    });
    document.getElementById('suppliesCount').textContent = allSupplies.length+' غرض';
    if(!rows.length){ suppliesList.innerHTML='<div class="empty-state">ما كاين حتى غرض فاللائحة</div>'; return; }
    suppliesList.innerHTML = rows.map(function(d){
      return '<div class="supply-row'+(d.bought?' bought':'')+'" data-id="'+d.id+'">'+
        '<button class="chk" data-action="toggle">'+(d.bought?'✓':'')+'</button>'+
        '<div class="main"><b>'+escapeHtml(d.name||'')+(d.qty?' — '+escapeHtml(d.qty):'')+'</b>'+
        (d.note?'<span>'+escapeHtml(d.note)+'</span>':'')+'</div>'+
        '<span class="prio '+(d.priority||'normal')+'">'+(d.priority==='high'?'عالية':'عادية')+'</span>'+
        '<button class="del-btn" data-action="del">حذف</button>'+
        '</div>';
    }).join('');
  }

  repairsList.addEventListener('click', async function(e){
    var btn=e.target.closest('button'); if(!btn || !db) return;
    var id=e.target.closest('.ticket').getAttribute('data-id');
    try{
      if(btn.dataset.action==='del'){
        if(confirm('نمسحو هاد التذكرة؟')) await db.collection('repairs').doc(id).delete();
      }
    }catch(err){ alert('ماقدرناش نديرو التغيير. تأكد من الصلاحيات.'); }
  });
  repairsList.addEventListener('change', async function(e){
    var sel=e.target.closest('select[data-action="status"]'); if(!sel || !db) return;
    var id=e.target.closest('.ticket').getAttribute('data-id');
    try{
      await db.collection('repairs').doc(id).update({status: sel.value});
    }catch(err){ alert('ماقدرناش نديرو التغيير. تأكد من الصلاحيات.'); }
  });
  document.getElementById('repairSearch').addEventListener('input', renderRepairs);

  suppliesList.addEventListener('click', async function(e){
    var btn=e.target.closest('button'); if(!btn || !db) return;
    var id=e.target.closest('.supply-row').getAttribute('data-id');
    try{
      if(btn.dataset.action==='toggle'){
        var doc=allSupplies.find(function(x){return x.id===id;});
        await db.collection('supplies').doc(id).update({bought: !doc.bought});
      } else if(btn.dataset.action==='del'){
        if(confirm('نمسحو هاد الغرض من اللائحة؟')) await db.collection('supplies').doc(id).delete();
      }
    }catch(err){ alert('ماقدرناش نديرو التغيير. تأكد من الصلاحيات.'); }
  });
  document.getElementById('supplySearch').addEventListener('input', renderSupplies);

  document.getElementById('repairForm').addEventListener('submit', async function(e){
    e.preventDefault();
    var msg=document.getElementById('repairMsg');
    if(!db){ msg.textContent='الخدمة غير متوفرة حاليا.'; return; }
    var priceVal=document.getElementById('r-price').value;
    var data={
      customer: document.getElementById('r-customer').value.trim(),
      model: document.getElementById('r-model').value.trim(),
      issue: document.getElementById('r-issue').value.trim(),
      price: priceVal? Number(priceVal): null,
      status: 'pending',
      createdAt: Date.now()
    };
    try{
      await db.collection('repairs').add(data);
      msg.textContent='تزادت التذكرة ✓';
      e.target.reset();
      setTimeout(function(){msg.textContent='';},2000);
    }catch(err){ msg.textContent='ماقدرناش نزيدو. تأكد من الصلاحيات ديالك.'; }
  });

  document.getElementById('supplyForm').addEventListener('submit', async function(e){
    e.preventDefault();
    var msg=document.getElementById('supplyMsg');
    if(!db){ msg.textContent='الخدمة غير متوفرة حاليا.'; return; }
    var data={
      name: document.getElementById('s-name').value.trim(),
      qty: document.getElementById('s-qty').value.trim(),
      priority: document.getElementById('s-priority').value,
      note: document.getElementById('s-note').value.trim(),
      bought: false,
      createdAt: Date.now()
    };
    try{
      await db.collection('supplies').add(data);
      msg.textContent='تزاد الغرض ✓';
      e.target.reset();
      setTimeout(function(){msg.textContent='';},2000);
    }catch(err){ msg.textContent='ماقدرناش نزيدو. تأكد من الصلاحيات ديالك.'; }
  });

  if(window.claude){
    try{
      db = await claude.use('db');
      if(db){
        var t1=setTimeout(function(){ repairsList.innerHTML='<div class="empty-state">كيتأخر التحميل...</div>'; },10000);
        db.collection('repairs').orderBy('createdAt','desc').limit(300).onSnapshot(function(snap){
          clearTimeout(t1);
          allRepairs = snap.docs.map(function(d){ var v=d.data()||{}; v.id=d.id; return v; });
          renderRepairs();
        }, function(err){ repairsList.innerHTML='<div class="empty-state">ماقدرناش نجيبو السجلات.</div>'; });

        var t2=setTimeout(function(){ suppliesList.innerHTML='<div class="empty-state">كيتأخر التحميل...</div>'; },10000);
        db.collection('supplies').orderBy('createdAt','desc').limit(300).onSnapshot(function(snap){
          clearTimeout(t2);
          allSupplies = snap.docs.map(function(d){ var v=d.data()||{}; v.id=d.id; return v; });
          renderSupplies();
        }, function(err){ suppliesList.innerHTML='<div class="empty-state">ماقدرناش نجيبو اللائحة.</div>'; });
      } else {
        repairsList.innerHTML='<div class="empty-state">خاصك تكون مسجل الدخول باش تشوف السجلات.</div>';
        suppliesList.innerHTML='<div class="empty-state">خاصك تكون مسجل الدخول باش تشوف اللائحة.</div>';
      }
    }catch(e){
      repairsList.innerHTML='<div class="empty-state">هاد الميزة ماشي متوفرة هنا.</div>';
      suppliesList.innerHTML='<div class="empty-state">هاد الميزة ماشي متوفرة هنا.</div>';
    }
  } else {
    repairsList.innerHTML='<div class="empty-state">هاد الميزة خدامة غير فالنسخة المنشورة.</div>';
    suppliesList.innerHTML='<div class="empty-state">هاد الميزة خدامة غير فالنسخة المنشورة.</div>';
  }
})();
</script>
</body>
</html>
