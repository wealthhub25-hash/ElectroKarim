<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إلكترو كريم — لوحة الموظفين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Changa:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#12151a; --surface:#1a1f26; --surface2:#20262e; --line:#2a313b;
  --text:#eceef1; --muted:#8e97a3; --teal:#2dd9bd; --teal-dim:#1a4d45;
  --amber:#f3a93b; --amber-dim:#3a2f17; --danger:#e8615a;
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--bg); color:var(--text);
  font-family:'Tajawal',sans-serif; line-height:1.6;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100%;
}
h1,h2,h3,.display{font-family:'Changa',sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}

header{
  position:sticky; top:0; z-index:20;
  background:rgba(18,21,26,.92); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);
}
.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;max-width:880px;margin:0 auto;flex-wrap:wrap;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Changa';font-weight:700;font-size:19px}
.brand .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--teal),#1aa88f);display:flex;align-items:center;justify-content:center;color:#0b1210;font-weight:800;font-size:14px}
.brand small{display:block;color:var(--muted);font-weight:400;font-size:11px;font-family:'Tajawal'}
.tabs{display:flex;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px}
.tab{padding:9px 18px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;border:none;background:none;color:var(--muted);font-family:inherit}
.tab.active{background:var(--teal);color:#06130f}

main{padding:28px 0 60px}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.panel-head h2{font-size:22px}
.count-pill{background:var(--surface2);border:1px solid var(--line);color:var(--muted);font-size:12.5px;padding:4px 12px;border-radius:999px}

.layout{display:grid;grid-template-columns:300px 1fr;gap:18px}
@media(max-width:760px){.layout{grid-template-columns:1fr}}

.card-form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;align-self:start}
.card-form h3{font-size:15px;margin-bottom:2px}
.card-form input,.card-form select,.card-form textarea{
  background:var(--surface2);border:1px solid var(--line);border-radius:9px;
  padding:10px 12px;color:var(--text);font-family:inherit;font-size:14px;outline:none;width:100%;
}
.card-form input:focus,.card-form select:focus,.card-form textarea:focus{border-color:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:10px;font-weight:700;font-size:14.5px;border:none;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--teal);color:#06130f}
.btn-secondary{background:transparent;border:1px solid var(--line);color:var(--text)}
.msg{font-size:12px;color:var(--muted);min-height:14px}

.search-row input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--text);font-family:inherit;font-size:14px;margin-bottom:14px}

.ticket{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.ticket .main b{display:block;font-size:14.5px}
.ticket .main span{color:var(--muted);font-size:12px}
.ticket .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;border:none;white-space:nowrap;font-family:inherit}
.badge.pending{background:var(--amber-dim);color:var(--amber)}
.badge.ready{background:var(--teal-dim);color:var(--teal)}
.badge.delivered{background:#262c33;color:var(--muted)}
.price-tag{font-family:'Changa';font-weight:700;color:var(--amber);font-size:14.5px}
.del-btn{background:none;border:1px solid var(--line);color:var(--danger);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:11.5px;font-family:inherit}
.empty-state{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}

.supply-row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:9px;display:flex;align-items:center;gap:12px}
.supply-row.bought{opacity:.5}
.supply-row.bought .main b{text-decoration:line-through}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);background:var(--surface2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--teal)}
.supply-row.bought .chk{background:var(--teal-dim);border-color:var(--teal)}
.supply-row .main{flex:1}
.supply-row .main b{display:block;font-size:14.5px}
.supply-row .main span{color:var(--muted);font-size:12px}
.prio{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px}
.prio.high{background:#3a1c1c;color:var(--danger)}
.prio.normal{background:var(--surface2);color:var(--muted)}

footer{border-top:1px solid var(--line);padding:18px 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand"><span class="mark">EK</span><span>إلكترو كريم<small>لوحة الموظفين — خاص بالمحل</small></span></div>
    <div class="tabs">
      <button class="tab active" data-tab="repairs">الإصلاحات</button>
      <button class="tab" data-tab="supplies">المشتريات المطلوبة</button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">

    <section id="panel-repairs">
      <div class="panel-head">
        <h2 class="display">سجل الإصلاحات</h2>
        <span class="count-pill" id="repairsCount">0 تذكرة</span>
      </div>
      <div class="layout">
        <form class="card-form" id="repairForm">
          <h3>تذكرة جديدة</h3>
          <input type="text" id="r-customer" placeholder="اسم الزبون" required>
          <input type="text" id="r-model" placeholder="موديل الهاتف" required>
          <input type="text" id="r-issue" placeholder="وصف العطب" required>
          <input type="number" id="r-price" placeholder="الثمن (درهم)">
          <button type="submit" class="btn btn-primary">إضافة التذكرة</button>
          <span class="msg" id="repairMsg"></span>
        </form>
        <div>
          <div class="search-row"><input type="text" id="repairSearch" placeholder="قلب باسم الزبون ولا الموديل..."></div>
          <div id="ticketsList"><div class="empty-state">كيتحمل...</div></div>
        </div>
      </div>
    </section>

    <section id="panel-supplies" style="display:none">
      <div class="panel-head">
        <h2 class="display">المشتريات المطلوبة</h2>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="count-pill" id="suppliesCount">0 غرض</span>
          <button class="btn btn-secondary" id="exportPdfBtn" type="button">⬇ تصدير PDF</button>
        </div>
      </div>
      <div class="layout">
        <form class="card-form" id="supplyForm">
          <h3>غرض جديد</h3>
          <input type="text" id="s-name" placeholder="اسم القطعة / الغرض" required>
          <input type="text" id="s-qty" placeholder="الكمية (مثال: 3 شاشات)">
          <select id="s-priority">
            <option value="عادية">أولوية عادية</option>
            <option value="عالية">أولوية عالية</option>
          </select>
          <textarea id="s-note" placeholder="ملاحظة (اختياري)"></textarea>
          <button type="submit" class="btn btn-primary">إضافة للائحة</button>
          <span class="msg" id="supplyMsg"></span>
        </form>
        <div>
          <div class="search-row"><input type="text" id="supplySearch" placeholder="قلب فلائحة المشتريات..."></div>
          <div id="suppliesList"><div class="empty-state">كيتحمل...</div></div>
        </div>
      </div>
    </section>

  </div>
</main>

<footer>إلكترو كريم — صفحة داخلية خاصة بالموظفين</footer>

<script>
/* ============================================================
   حط هنا رابط الـ Web app ديال Google Apps Script
   (شكلو: https://script.google.com/macros/s/XXXXXXXX/exec)
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbxvH7HgwEem55FZGg14YP7lhdubwb32YRJjQRPpmbET-Q5UCHWz0aGoqpdhUMlbD5XQng/exec";

const REPAIR_SHEET = "اصلاحات";
const SUPPLY_SHEET = "مشتريات";

function escapeHtml(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

async function apiGet(sheet){
  const res = await fetch(API_URL + "?sheet=" + encodeURIComponent(sheet));
  if(!res.ok) throw new Error("fetch failed");
  return res.json();
}
async function apiPost(payload){
  const res = await fetch(API_URL, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error("post failed");
  return res.json();
}

document.querySelectorAll('.tab').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
    btn.classList.add('active');
    var name = btn.dataset.tab;
    document.getElementById('panel-repairs').style.display = name==='repairs' ? '' : 'none';
    document.getElementById('panel-supplies').style.display = name==='supplies' ? '' : 'none';
    if(name==='repairs') loadRepairs(); else loadSupplies();
  });
});

/* ---------------- الإصلاحات ---------------- */
var allRepairs = [];
var statusLabel = {"قيد الإصلاح":"قيد الإصلاح","جاهز للاستلام":"جاهز للاستلام","تم التسليم":"تم التسليم"};

async function loadRepairs(){
  var list = document.getElementById('ticketsList');
  try{
    allRepairs = await apiGet(REPAIR_SHEET);
    renderRepairs();
  }catch(err){
    list.innerHTML = '<div class="empty-state">ماقدرناش نجيبو السجلات. تأكد من رابط الـ API.</div>';
  }
}

function renderRepairs(){
  var list = document.getElementById('ticketsList');
  var q = (document.getElementById('repairSearch').value || '').trim().toLowerCase();
  var rows = allRepairs.filter(function(d){
    if(!q) return true;
    return ((d["اسم الزبون"]||'') + ' ' + (d["الموديل"]||'')).toLowerCase().indexOf(q) > -1;
  });
  document.getElementById('repairsCount').textContent = allRepairs.length + ' تذكرة';
  if(!rows.length){ list.innerHTML = '<div class="empty-state">ما كاين حتى تذكرة</div>'; return; }
  list.innerHTML = rows.map(function(d){
    var status = d["الحالة"] || "قيد الإصلاح";
    var cls = status === "تم التسليم" ? "delivered" : (status === "جاهز للاستلام" ? "ready" : "pending");
    return '<div class="ticket" data-row="'+d._row+'">'+
      '<div class="main"><b>'+escapeHtml(d["اسم الزبون"]||'')+' — '+escapeHtml(d["الموديل"]||'')+'</b>'+
      '<span>'+escapeHtml(d["وصف العطب"]||'')+'</span></div>'+
      '<div class="meta">'+
      '<span class="price-tag">'+(d["الثمن"]!==''&&d["الثمن"]!=null ? d["الثمن"]+' درهم' : '—')+'</span>'+
      '<select class="badge '+cls+'" data-action="status">'+
      '<option value="قيد الإصلاح"'+(status==='قيد الإصلاح'?' selected':'')+'>قيد الإصلاح</option>'+
      '<option value="جاهز للاستلام"'+(status==='جاهز للاستلام'?' selected':'')+'>جاهز للاستلام</option>'+
      '<option value="تم التسليم"'+(status==='تم التسليم'?' selected':'')+'>تم التسليم</option>'+
      '</select>'+
      '<button class="del-btn" data-action="del">حذف</button>'+
      '</div></div>';
  }).join('');
}

document.getElementById('ticketsList').addEventListener('click', async function(e){
  var btn = e.target.closest('button[data-action="del"]'); if(!btn) return;
  var row = e.target.closest('.ticket').getAttribute('data-row');
  if(!confirm('نمسحو هاد التذكرة؟')) return;
  try{
    await apiPost({sheet: REPAIR_SHEET, action: "delete", row: Number(row)});
    loadRepairs();
  }catch(err){ alert('ماقدرناش نمسحو. عاود جرب.'); }
});
document.getElementById('ticketsList').addEventListener('change', async function(e){
  var sel = e.target.closest('select[data-action="status"]'); if(!sel) return;
  var row = e.target.closest('.ticket').getAttribute('data-row');
  try{
    await apiPost({sheet: REPAIR_SHEET, action: "update", row: Number(row), data: {"الحالة": sel.value}});
    loadRepairs();
  }catch(err){ alert('ماقدرناش نديرو التغيير. عاود جرب.'); }
});
document.getElementById('repairSearch').addEventListener('input', renderRepairs);

document.getElementById('repairForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var msg = document.getElementById('repairMsg');
  var data = {
    "اسم الزبون": document.getElementById('r-customer').value.trim(),
    "الموديل": document.getElementById('r-model').value.trim(),
    "وصف العطب": document.getElementById('r-issue').value.trim(),
    "الثمن": document.getElementById('r-price').value ? Number(document.getElementById('r-price').value) : '',
    "الحالة": "قيد الإصلاح",
    "تاريخ الإضافة": new Date().toLocaleString('ar-MA')
  };
  try{
    await apiPost({sheet: REPAIR_SHEET, action: "add", data: data});
    msg.textContent = 'تزادت التذكرة ✓';
    e.target.reset();
    loadRepairs();
    setTimeout(function(){ msg.textContent=''; }, 2000);
  }catch(err){ msg.textContent = 'ماقدرناش نزيدو. تأكد من رابط الـ API.'; }
});

/* ---------------- المشتريات ---------------- */
var allSupplies = [];

async function loadSupplies(){
  var list = document.getElementById('suppliesList');
  try{
    allSupplies = await apiGet(SUPPLY_SHEET);
    renderSupplies();
  }catch(err){
    list.innerHTML = '<div class="empty-state">ماقدرناش نجيبو اللائحة. تأكد من رابط الـ API.</div>';
  }
}

function renderSupplies(){
  var list = document.getElementById('suppliesList');
  var q = (document.getElementById('supplySearch').value || '').trim().toLowerCase();
  var rows = allSupplies.filter(function(d){
    if(!q) return true;
    return ((d["الاسم"]||'') + ' ' + (d["ملاحظة"]||'')).toLowerCase().indexOf(q) > -1;
  });
  document.getElementById('suppliesCount').textContent = allSupplies.length + ' غرض';
  if(!rows.length){ list.innerHTML = '<div class="empty-state">ما كاين حتى غرض فاللائحة</div>'; return; }
  list.innerHTML = rows.map(function(d){
    var bought = d["الحالة"] === "تم الشراء";
    return '<div class="supply-row'+(bought?' bought':'')+'" data-row="'+d._row+'">'+
      '<button class="chk" data-action="toggle">'+(bought?'✓':'')+'</button>'+
      '<div class="main"><b>'+escapeHtml(d["الاسم"]||'')+(d["الكمية"]?' — '+escapeHtml(d["الكمية"]):'')+'</b>'+
      (d["ملاحظة"]?'<span>'+escapeHtml(d["ملاحظة"])+'</span>':'')+'</div>'+
      '<span class="prio '+(d["الأولوية"]==='عالية'?'high':'normal')+'">'+(d["الأولوية"]||'عادية')+'</span>'+
      '<button class="del-btn" data-action="del">حذف</button>'+
      '</div>';
  }).join('');
}

document.getElementById('suppliesList').addEventListener('click', async function(e){
  var btn = e.target.closest('button'); if(!btn) return;
  var row = e.target.closest('.supply-row').getAttribute('data-row');
  try{
    if(btn.dataset.action === 'toggle'){
      var doc = allSupplies.find(function(x){ return String(x._row) === row; });
      var newStatus = (doc["الحالة"] === "تم الشراء") ? "لم يشترى بعد" : "تم الشراء";
      await apiPost({sheet: SUPPLY_SHEET, action: "update", row: Number(row), data: {"الحالة": newStatus}});
      loadSupplies();
    } else if(btn.dataset.action === 'del'){
      if(confirm('نمسحو هاد الغرض من اللائحة؟')){
        await apiPost({sheet: SUPPLY_SHEET, action: "delete", row: Number(row)});
        loadSupplies();
      }
    }
  }catch(err){ alert('ماقدرناش نديرو التغيير. عاود جرب.'); }
});
document.getElementById('supplySearch').addEventListener('input', renderSupplies);

document.getElementById('supplyForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var msg = document.getElementById('supplyMsg');
  var data = {
    "الاسم": document.getElementById('s-name').value.trim(),
    "الكمية": document.getElementById('s-qty').value.trim(),
    "الأولوية": document.getElementById('s-priority').value,
    "الحالة": "لم يشترى بعد",
    "ملاحظة": document.getElementById('s-note').value.trim(),
    "تاريخ الإضافة": new Date().toLocaleString('ar-MA')
  };
  try{
    await apiPost({sheet: SUPPLY_SHEET, action: "add", data: data});
    msg.textContent = 'تزاد الغرض ✓';
    e.target.reset();
    loadSupplies();
    setTimeout(function(){ msg.textContent=''; }, 2000);
  }catch(err){ msg.textContent = 'ماقدرناش نزيدو. تأكد من رابط الـ API.'; }
});

/* ---------------- تصدير PDF ---------------- */
document.getElementById('exportPdfBtn').addEventListener('click', async function(){
  if(!window.jspdf || !window.html2canvas){ alert('الأدوات مازال كتتحمل، عاود بعد شوية.'); return; }
  var items = allSupplies;
  var container = document.createElement('div');
  container.style.cssText = 'width:700px;padding:30px;background:#fff;color:#111;font-family:Tajawal,sans-serif;direction:rtl;position:fixed;top:-9999px;left:-9999px;';
  var rowsHtml = items.map(function(d,i){
    return '<tr style="border-bottom:1px solid #ddd;">'+
      '<td style="padding:8px;text-align:right;">'+(i+1)+'</td>'+
      '<td style="padding:8px;text-align:right;">'+escapeHtml(d["الاسم"]||'')+'</td>'+
      '<td style="padding:8px;text-align:right;">'+escapeHtml(d["الكمية"]||'')+'</td>'+
      '<td style="padding:8px;text-align:right;">'+(d["الأولوية"]||'عادية')+'</td>'+
      '<td style="padding:8px;text-align:right;">'+(d["الحالة"]||'لم يشترى بعد')+'</td>'+
      '<td style="padding:8px;text-align:right;">'+escapeHtml(d["ملاحظة"]||'')+'</td>'+
    '</tr>';
  }).join('');
  container.innerHTML =
    '<h2 style="font-size:20px;margin-bottom:4px;">إلكترو كريم — لائحة المشتريات المطلوبة</h2>'+
    '<div style="font-size:12px;color:#666;margin-bottom:16px;">'+new Date().toLocaleDateString('ar-MA')+'</div>'+
    '<table style="width:100%;border-collapse:collapse;font-size:13px;">'+
    '<thead><tr style="border-bottom:2px solid #111;"><th style="padding:8px;text-align:right;">#</th><th style="padding:8px;text-align:right;">الغرض</th><th style="padding:8px;text-align:right;">الكمية</th><th style="padding:8px;text-align:right;">الأولوية</th><th style="padding:8px;text-align:right;">الحالة</th><th style="padding:8px;text-align:right;">ملاحظة</th></tr></thead>'+
    '<tbody>'+(rowsHtml || '<tr><td colspan="6" style="padding:12px;text-align:center;color:#999;">ما كاين حتى غرض</td></tr>')+'</tbody>'+
    '</table>';
  document.body.appendChild(container);
  try{
    var canvas = await html2canvas(container, {scale:2, backgroundColor:'#ffffff'});
    var imgData = canvas.toDataURL('image/png');
    var jsPDFLib = window.jspdf.jsPDF;
    var pdf = new jsPDFLib({unit:'pt', format:'a4'});
    var pageWidth = pdf.internal.pageSize.getWidth();
    var pageHeight = pdf.internal.pageSize.getHeight();
    var imgW = pageWidth - 40;
    var imgH = canvas.height * imgW / canvas.width;
    if(imgH > pageHeight - 40){ imgH = pageHeight - 40; imgW = canvas.width*imgH/canvas.height; }
    pdf.addImage(imgData, 'PNG', 20, 20, imgW, imgH);
    pdf.save('مشتريات-الكترو-كريم.pdf');
  }catch(err){
    alert('ماقدرناش ندير PDF. عاود جرب.');
  } finally {
    document.body.removeChild(container);
  }
});

/* ---------------- تحميل أولي + تحديث دوري ---------------- */
loadRepairs();
setInterval(function(){
  var active = document.querySelector('.tab.active').dataset.tab;
  if(active === 'repairs') loadRepairs(); else loadSupplies();
}, 20000);
