<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12151a">
<title>إلكترو كريم — لوحة الموظفين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Changa:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#101318;--surface:#191e26;--surface2:#202731;--line:#2b3440;--text:#edf1f5;--muted:#929dab;--teal:#2dd9bd;--teal-dark:#174b43;--amber:#f3b34c;--red:#ef716b;--shadow:0 16px 40px #0003}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#1c292c 0,transparent 35%),var(--bg);color:var(--text);font-family:Tajawal,sans-serif;min-height:100vh;line-height:1.6}
button,input,select,textarea{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:#101318eF;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topbar{max-width:1100px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;font:700 20px Changa,Tajawal,sans-serif}.mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--teal),#149c88);color:#071411;font:800 16px Changa;box-shadow:0 7px 20px #2dd9bd30}.brand small{display:block;color:var(--muted);font:400 12px Tajawal}
.tabs{display:flex;gap:5px;background:var(--surface);border:1px solid var(--line);padding:5px;border-radius:14px}.tab{border:0;background:transparent;color:var(--muted);padding:10px 18px;border-radius:10px;font-weight:800}.tab.active{background:var(--teal);color:#071411}
main{max-width:1100px;margin:auto;padding:30px 22px 65px}.heading{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}.heading h1{font:700 25px Changa;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:3px}
.pill{background:var(--surface2);border:1px solid var(--line);border-radius:30px;padding:6px 13px;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:20px;align-items:start}
.card{background:linear-gradient(155deg,#1b212a,#171c23);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.card h2{font:600 17px Changa;margin:0 0 15px}
.form{display:grid;gap:11px}.field{width:100%;border:1px solid var(--line);border-radius:11px;background:var(--surface2);color:var(--text);padding:12px 13px;outline:none;min-width:0}.field:focus{border-color:var(--teal);box-shadow:0 0 0 3px #2dd9bd18}.field::placeholder{color:#788391}.field.textarea{min-height:90px;resize:vertical}
.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:800;transition:.15s}.btn:active{transform:scale(.98)}.primary{background:var(--teal);color:#071411}.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--line)}.danger{color:var(--red);background:#3a2023;border:1px solid #573034}.form .btn{width:100%}
.msg{min-height:18px;color:var(--muted);font-size:12px}.msg.error{color:var(--red)}.msg.ok{color:var(--teal)}
.toolbar{display:flex;gap:9px;margin-bottom:13px}.search{flex:1;min-width:0}
.items{display:grid;gap:10px}.ticket,.supply{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 16px}.item-main{min-width:0;flex:1}.item-main strong{display:block;font-size:15px;overflow-wrap:anywhere}.item-main small{display:block;color:var(--muted);font-size:12px;margin-top:3px;overflow-wrap:anywhere}
.item-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}.price{font:700 15px Changa;color:var(--amber);white-space:nowrap}.status{max-width:155px;padding:7px 9px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);color:var(--text);font-size:12px}
.small-btn{padding:7px 10px;border-radius:9px;font-size:12px;font-weight:700}.priority{font-size:11px;font-weight:800;border-radius:30px;padding:5px 10px;white-space:nowrap}.priority.high{background:#3a2023;color:var(--red)}.priority.normal{background:var(--surface2);color:var(--muted)}
.check{width:25px;height:25px;border:1px solid #53606e;border-radius:8px;background:var(--surface2);color:var(--teal);font-weight:900;flex-shrink:0}.bought{opacity:.55}.bought .item-main strong{text-decoration:line-through}
.empty{padding:42px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.loading{color:var(--muted);text-align:center;padding:25px}.hidden{display:none!important}
footer{text-align:center;color:var(--muted);border-top:1px solid var(--line);padding:18px 12px;font-size:12px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.topbar{padding:12px 15px}.tabs{width:100%}.tab{flex:1;padding:9px 7px;font-size:13px}main{padding:22px 14px 45px}.heading h1{font-size:22px}.card{padding:16px}.ticket,.supply{align-items:flex-start;flex-wrap:wrap}.item-actions{width:100%;justify-content:space-between}.status{max-width:none;flex:1}}
@media print{body{background:white;color:#111}.topbar,.form-card,.toolbar,.tabs,footer,.item-actions button,.item-actions select{display:none!important}main{padding:0;max-width:none}.card,.ticket,.supply{background:white;color:#111;border:1px solid #ccc;box-shadow:none;break-inside:avoid}.item-main small{color:#555}.heading h1{color:#111}}
</style>
</head>
<body>
<header><div class="topbar">
 <div class="brand"><span class="mark">EK</span><span>إلكترو كريم<small>لوحة الموظفين — خاصة بالمحل</small></span></div>
 <nav class="tabs" aria-label="الأقسام"><button class="tab active" data-tab="repairs">الإصلاحات</button><button class="tab" data-tab="supplies">المشتريات المطلوبة</button></nav>
</div></header>
<main>
<section id="repairsPanel">
 <div class="heading"><div><h1>سجل الإصلاحات</h1><div class="sub">تتبع الأجهزة وحالة كل عملية إصلاح</div></div><span class="pill" id="repairCount">0 تذكرة</span></div>
 <div class="grid">
  <div class="card form-card"><h2>＋ تذكرة إصلاح جديدة</h2><form class="form" id="repairForm">
   <input class="field" id="customer" placeholder="اسم الزبون" required maxlength="120">
   <input class="field" id="model" placeholder="موديل الهاتف" required maxlength="120">
   <input class="field" id="issue" placeholder="وصف العطب" required maxlength="500">
   <input class="field" id="price" type="number" min="0" step="0.01" placeholder="الثمن (درهم)">
   <button class="btn primary" type="submit">إضافة التذكرة</button><div class="msg" id="repairMsg" role="status"></div>
  </form></div>
  <div><div class="toolbar"><input class="field search" id="repairSearch" placeholder="قلب باسم الزبون أو الموديل..."><button class="btn secondary" id="refreshRepairs" type="button">تحديث</button></div><div class="items" id="repairsList"><div class="loading">جاري تحميل السجلات...</div></div></div>
 </div>
</section>
<section id="suppliesPanel" class="hidden">
 <div class="heading"><div><h1>المشتريات المطلوبة</h1><div class="sub">لائحة القطع والأغراض التي خاصها تتشرى</div></div><div style="display:flex;gap:8px;align-items:center"><span class="pill" id="supplyCount">0 غرض</span><button class="btn secondary" id="printSupplies" type="button">طباعة / PDF</button></div></div>
 <div class="grid">
  <div class="card form-card"><h2>＋ إضافة غرض جديد</h2><form class="form" id="supplyForm">
   <input class="field" id="sName" placeholder="اسم القطعة / الغرض" required maxlength="160">
   <input class="field" id="sQty" placeholder="الكمية (مثال: 3 شاشات)" maxlength="100">
   <select class="field" id="sPriority"><option value="عادية">أولوية عادية</option><option value="عالية">أولوية عالية</option></select>
   <textarea class="field textarea" id="sNote" placeholder="ملاحظة (اختياري)" maxlength="500"></textarea>
   <button class="btn primary" type="submit">إضافة للائحة</button><div class="msg" id="supplyMsg" role="status"></div>
  </form></div>
  <div><div class="toolbar"><input class="field search" id="supplySearch" placeholder="قلب فلائحة المشتريات..."><button class="btn secondary" id="refreshSupplies" type="button">تحديث</button></div><div class="items" id="suppliesList"><div class="loading">جاري تحميل اللائحة...</div></div></div>
 </div>
</section>
</main><footer>إلكترو كريم — صفحة داخلية خاصة بالموظفين</footer>
<script>
'use strict';
const REPAIRS='اصلاحات', SUPPLIES='مشتريات';
let repairs=[], supplies=[];
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(payload, method='GET'){
 const url=method==='GET'?`/api?sheet=${encodeURIComponent(payload.sheet)}`:'/api';
 const response=await fetch(url,{method,headers:method==='POST'?{'Content-Type':'application/json'}:undefined,body:method==='POST'?JSON.stringify(payload):undefined});
 let result; try{result=await response.json()}catch{throw new Error('استجابة غير مفهومة من الخادم')}
 if(!response.ok||result.ok===false)throw new Error(result.error||'وقع خطأ في الاتصال');
 return result.data??result;
}
function message(id,text,type=''){const el=$(id);el.textContent=text;el.className='msg '+type}
function setBusy(form,busy){form.querySelector('button[type=submit]').disabled=busy;form.querySelector('button[type=submit]').textContent=busy?'جاري الحفظ...':(form.id==='repairForm'?'إضافة التذكرة':'إضافة للائحة')}
async function loadRepairs(){ $('repairsList').innerHTML='<div class="loading">جاري تحميل السجلات...</div>';try{repairs=await api({sheet:REPAIRS});renderRepairs()}catch(e){$('repairsList').innerHTML=`<div class="empty">تعذر تحميل الإصلاحات: ${esc(e.message)}</div>`}}
async function loadSupplies(){ $('suppliesList').innerHTML='<div class="loading">جاري تحميل اللائحة...</div>';try{supplies=await api({sheet:SUPPLIES});renderSupplies()}catch(e){$('suppliesList').innerHTML=`<div class="empty">تعذر تحميل المشتريات: ${esc(e.message)}</div>`}}
function renderRepairs(){const q=$('repairSearch').value.trim().toLowerCase();const rows=repairs.filter(x=>(`${x['اسم الزبون']||''} ${x['الموديل']||''} ${x['وصف العطب']||''}`).toLowerCase().includes(q));$('repairCount').textContent=`${repairs.length} تذكرة`;
 $('repairsList').innerHTML=rows.length?rows.map(d=>{const st=d['الحالة']||'قيد الإصلاح';return `<article class="ticket" data-row="${Number(d._row)}"><div class="item-main"><strong>${esc(d['اسم الزبون'])} — ${esc(d['الموديل'])}</strong><small>${esc(d['وصف العطب'])}</small><small>${esc(d['تاريخ الإضافة']||'')}</small></div><div class="item-actions"><span class="price">${d['الثمن']!==''&&d['الثمن']!=null?esc(d['الثمن'])+' درهم':'—'}</span><select class="status" data-action="status" aria-label="حالة الإصلاح"><option ${st==='قيد الإصلاح'?'selected':''}>قيد الإصلاح</option><option ${st==='جاهز للاستلام'?'selected':''}>جاهز للاستلام</option><option ${st==='تم التسليم'?'selected':''}>تم التسليم</option></select><button class="btn danger small-btn" data-action="delete">حذف</button></div></article>`}).join(''):'<div class="empty">ما كاين حتى تذكرة مطابقة</div>'}
function renderSupplies(){const q=$('supplySearch').value.trim().toLowerCase();const rows=supplies.filter(x=>(`${x['الاسم']||''} ${x['ملاحظة']||''} ${x['الكمية']||''}`).toLowerCase().includes(q));$('supplyCount').textContent=`${supplies.length} غرض`;
 $('suppliesList').innerHTML=rows.length?rows.map(d=>{const bought=d['الحالة']==='تم الشراء';return `<article class="supply ${bought?'bought':''}" data-row="${Number(d._row)}"><button class="check" data-action="toggle" aria-label="تغيير حالة الشراء">${bought?'✓':''}</button><div class="item-main"><strong>${esc(d['الاسم'])}${d['الكمية']?' — '+esc(d['الكمية']):''}</strong>${d['ملاحظة']?`<small>${esc(d['ملاحظة'])}</small>`:''}</div><span class="priority ${d['الأولوية']==='عالية'?'high':'normal'}">${esc(d['الأولوية']||'عادية')}</span><button class="btn danger small-btn" data-action="delete">حذف</button></article>`}).join(''):'<div class="empty">ما كاين حتى غرض مطابق</div>'}
$('repairForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget;setBusy(f,true);message('repairMsg','');try{await api({sheet:REPAIRS,action:'add',data:{'اسم الزبون':$('customer').value.trim(),'الموديل':$('model').value.trim(),'وصف العطب':$('issue').value.trim(),'الثمن':$('price').value?Number($('price').value):'','الحالة':'قيد الإصلاح','تاريخ الإضافة':new Date().toLocaleString('ar-MA')}},'POST');f.reset();message('repairMsg','تزادت التذكرة بنجاح ✓','ok');await loadRepairs()}catch(err){message('repairMsg',err.message,'error')}finally{setBusy(f,false)}});
$('supplyForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget;setBusy(f,true);message('supplyMsg','');try{await api({sheet:SUPPLIES,action:'add',data:{'الاسم':$('sName').value.trim(),'الكمية':$('sQty').value.trim(),'الأولوية':$('sPriority').value,'الحالة':'لم يشترى بعد','ملاحظة':$('sNote').value.trim(),'تاريخ الإضافة':new Date().toLocaleString('ar-MA')}},'POST');f.reset();message('supplyMsg','تزاد الغرض بنجاح ✓','ok');await loadSupplies()}catch(err){message('supplyMsg',err.message,'error')}finally{setBusy(f,false)}});
$('repairsList').addEventListener('change',async e=>{if(e.target.dataset.action!=='status')return;const card=e.target.closest('[data-row]');try{await api({sheet:REPAIRS,action:'update',row:Number(card.dataset.row),data:{'الحالة':e.target.value}},'POST');await loadRepairs()}catch(err){alert('تعذر تحديث الحالة: '+err.message);loadRepairs()}});
$('repairsList').addEventListener('click',async e=>{const b=e.target.closest('[data-action=delete]');if(!b)return;const card=b.closest('[data-row]');if(!confirm('واش متأكد بغيتي تمسح هاد التذكرة؟'))return;try{await api({sheet:REPAIRS,action:'delete',row:Number(card.dataset.row)},'POST');await loadRepairs()}catch(err){alert(err.message)}});
$('suppliesList').addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const card=b.closest('[data-row]'),row=Number(card.dataset.row);try{if(b.dataset.action==='delete'){if(!confirm('واش متأكد بغيتي تمسح هاد الغرض؟'))return;await api({sheet:SUPPLIES,action:'delete',row},'POST')}else{const d=supplies.find(x=>Number(x._row)===row);await api({sheet:SUPPLIES,action:'update',row,data:{'الحالة':d['الحالة']==='تم الشراء'?'لم يشترى بعد':'تم الشراء'}},'POST')}await loadSupplies()}catch(err){alert('تعذر تنفيذ العملية: '+err.message)}});
$('repairSearch').addEventListener('input',renderRepairs);$('supplySearch').addEventListener('input',renderSupplies);
$('refreshRepairs').onclick=loadRepairs;$('refreshSupplies').onclick=loadSupplies;$('printSupplies').onclick=()=>window.print();
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));$('repairsPanel').classList.toggle('hidden',b.dataset.tab!=='repairs');$('suppliesPanel').classList.toggle('hidden',b.dataset.tab!=='supplies');if(b.dataset.tab==='repairs')loadRepairs();else loadSupplies()}));
loadRepairs();
</script>
</body></html>
